packages:
  - packages/*
  - apps/*
  - tools
  # The city's model sources: builders, specs, outlines and the stage (decision 0005)
  - assets-src
allowBuilds:
  esbuild: false
  # workerd downloads its binary for the server's local runtime
  workerd: true

# The asset tools reach sharp through gltf-transform; 0.35.5 clears the librsvg advisory.
overrides:
  sharp: ^0.35.5
