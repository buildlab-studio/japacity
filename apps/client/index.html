<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2a5e" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Japacity</title>
    <!-- The splash (engine:browser-authority-for-dev-only): shared/ui/Splash.tsx renders the same; its test holds them equal. -->
    <style>body{margin:0;background:var(--sheet,#eaf3fb)}.splash{padding:22vh 16px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--text,#131a33);font-family:Rubik,system-ui,sans-serif}.splash-mark{width:88px;height:88px}.splash-name{margin:14px 0 0;font-size:30px;font-weight:700;line-height:1.2}.splash-words,.splash-more{margin:10px 0 0;font-size:16px;color:var(--text-2,#56607e)}.splash-words{animation:splash-pulse 2s ease-in-out infinite}.splash-more{margin-top:4px;font-size:14px}@keyframes splash-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.splash-words{animation:none}}</style>
  </head>
  <body>
    <svg style="position:absolute;width:0;height:0" aria-hidden="true"><symbol id="japacity-mark" viewBox="0 0 512 512"><circle cx="256" cy="256" r="256" fill="#1c2a5e"/><circle cx="256" cy="256" r="238" fill="none" stroke="#eaf3fb" stroke-width="24"/><path d="M95.3 170.6A182 182 0 0 1 416.7 170.6" fill="none" stroke="#eaf3fb" stroke-width="22" stroke-linecap="round"/><circle cx="182.0" cy="127.8" r="35" fill="#f2b705"/><circle cx="330.0" cy="127.8" r="35" fill="#cfe9ff"/><path d="M-40 -78H34V22A52 52 0 0 1 -70 22" fill="none" stroke="#eaf3fb" stroke-width="42.1" transform="translate(256 256) scale(0.78) translate(18 2)"/></symbol></svg>
    <div id="root"><div class="splash" data-splash=""><svg class="splash-mark" aria-hidden="true"><use href="#japacity-mark"></use></svg><p class="splash-name">Japacity</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
