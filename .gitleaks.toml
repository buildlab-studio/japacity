# Secret scanning: gitleaks with its default rules, run on every pull request's commits by the
# check workflow (.github/workflows/check.yml) and locally with `gitleaks git --config .gitleaks.toml` or
# `gitleaks dir --config .gitleaks.toml`. Nothing here is allowed by its value: each entry names a place or a shape,
# and says why what is there is not a secret.

title = "Japacity"

[extend]
useDefault = true

# The default rule for a long value after a word like key, token or secret: narrowed, never turned off. Every other
# rule (a provider's key, a private key, a cloud token) still runs on every file, tests included.
[[rules]]
id = "generic-api-key"

# Tests and browser specs hold made-up values in a secret's shape on purpose: a software passkey's id, which is the
# words "software-passkey" in base64url (apps/server/src/routes/admin/passkey.test.ts), and the web push sample's
# published public key (apps/client/e2e/asks.spec.ts).
[[rules.allowlists]]
description = "Made-up values in tests and browser specs"
paths = ['''\.test\.tsx?$''', '''(^|/)e2e/[^/]+\.spec\.ts$''']

# The placeholder value the browser tests' config sets for a key it never uses: the hex digits in order, repeated
# (apps/client/playwright.config.ts), the same shape the scrub check uses for a made-up id.
[[rules.allowlists]]
description = "The hex digits in order, a placeholder"
regexes = ['''^(0123456789abcdef)+$''']

# The game's content ids, `kind.slug` in lower case with dots (place.peckham.sign.18): a shop sign that reads
# "KEYS CUT" puts the word before the next id (packages/content/src/place/place.text.ts), and a sign's `key` names one
# (packages/model-kit/src/load.test.ts). No secret has that shape.
[[rules.allowlists]]
description = "Content ids"
regexes = ['''^[a-z][a-z0-9-]*(\.[a-z0-9-]+)+$''']

# The passkey providers' AAGUIDs: published authenticator model ids from the community list, which name a password
# manager and prove nothing (apps/client/src/shared/net/providers.ts). Only that file, and only a UUID in that place.
[[rules.allowlists]]
description = "Published passkey AAGUIDs in the provider map"
condition = "AND"
paths = ['''^apps/client/src/shared/net/providers\.ts$''']
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

# Places and shapes that are never a secret, for every rule.
[[allowlists]]
description = "Built output, binary models, and the public Web Analytics site tag"
# The models are binary glTF whose base64 runs look like keys; the built client is never committed.
paths = ['''\.glb$''', '''(^|/)dist/''']

[[allowlists]]
description = "The Web Analytics beacon's site tag in a built page: a public tag the page must carry, not a secret"
regexTarget = "line"
regexes = ['''data-cf-beacon=''']

[[allowlists]]
description = "Published placeholders: Turnstile's test keys, which always pass, and the hash in a generated types file"
regexTarget = "line"
regexes = [
  '''\b[123]x0{20}AA\b''',
  '''\b[123]x0{31}AA\b''',
  '''^// Generated by Wrangler by running .*\(hash: [0-9a-f]{32}\)$''',
]

[[allowlists]]
description = "Actions pinned to a commit: a 40-hex commit id after @ on a uses line"
regexTarget = "line"
regexes = ['''^\s*(-\s+)?uses:\s+[\w.-]+/[\w./-]+@[0-9a-f]{40}\b''']

# The asset manifest maps each shipped file to its content hash; a long hex hash is not a token.
[[allowlists]]
description = "Content hashes in the asset manifest"
paths = ['''^models/manifest\.json$''', '''^assets-src/manifest\.json$''']
