name: deploy-staging

# Staging after every push to main whose check passed (
# the Cloudflare audit's finding 13: a deploy waits for the check instead of running beside it;
# docs/site/built/your-own-copy.md). It deploys the very commit the check passed, never a later one.
# Safe in a fork: the job runs only in buildlab-studio/japacity, only for a check run of a push to this repository's
# main (a pull request's run, or a fork's branch that happens to be called main, never starts it), and the Cloudflare
# secrets live in this repository's `staging` environment, which a fork and a pull request never see. Until the maintainer
# has set the environment's secrets the job stops quietly at its first step with a notice, and deploys nothing.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

# Two pushes never deploy at once: the newer one waits for the one running, and is never cancelled halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'buildlab-studio/japacity' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: The environment's secrets are set
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::The staging environment has no CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID yet, so nothing is deployed."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the check passed; a run started by workflow_run would otherwise check out main as it is now.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json.
      - if: steps.ready.outputs.set == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.ready.outputs.set == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - if: steps.ready.outputs.set == 'true'
        run: pnpm install --frozen-lockfile

      # The migrations go first, then the build, then the Worker (server.md R-SERVER-044): a deploy never runs a Worker
      # against a schema behind it. DATABASE_URL_UNPOOLED is the staging branch's direct string for the migrator role, the
      # role that owns the schema and drizzle's journal; never the app role's, which cannot write them. Once the
      # Cloudflare pair is set, a missing string fails here and nothing is built or deployed; a failed migration does
      # the same, since every later step runs only after this one succeeded.
      - name: Migrate the database
        if: steps.ready.outputs.set == 'true'
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::The staging environment has no DATABASE_URL_UNPOOLED secret (the migrator role's direct string), so nothing is migrated or deployed."
            exit 1
          fi
          pnpm --filter @japacity/db db:migrate

      # The client is built for staging's own address with the environment's variables (none is a secret: each
      # ends up in the page). The Worker serves this build.
      - name: Build the client
        if: steps.ready.outputs.set == 'true'
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_ANALYTICS_TOKEN: ${{ vars.VITE_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$VITE_SERVER_URL" ] || [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "::error::Set the staging environment's variables VITE_SERVER_URL and VITE_TURNSTILE_SITE_KEY before deploying."
            exit 1
          fi
          VITE_BUILD="$(git rev-parse --short HEAD)" pnpm build

      # The admin accounts are the Worker's own ADMIN_ACCOUNTS secret, set once with `wrangler secret put ADMIN_ACCOUNTS
      # --env staging` and kept by every deploy (server.md R-SERVER-012); unset, staging has no
      # admin. Wrangler is the version apps/server/package.json pins.
      - name: Deploy the Worker to staging
        if: steps.ready.outputs.set == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          workingDirectory: apps/server
          packageManager: pnpm
          command: deploy --env staging
