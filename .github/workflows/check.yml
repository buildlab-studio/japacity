name: check

# Runs by hand only while the build pushes many times a day: the organisation is on
# the free plan and the repository is private, so Actions minutes are counted.
# At the readiness stage restore:
#   push:
#     branches: [main]
#   pull_request:
# and enable the workflow again on GitHub (it was disabled there on 8 Oct 2026).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check:protected diffs against the base branch, so it needs history.
          fetch-depth: 0

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Protected files
        if: github.event_name == 'pull_request'
        env:
          APPROVED_TEST_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'approved-test-change') && '1' || '0' }}
        run: pnpm check:protected -- origin/${{ github.base_ref }}
