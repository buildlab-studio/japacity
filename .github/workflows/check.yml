name: check

# The quick checks on every push to main and every pull request: typecheck, lint and the unit tests
# (about four minutes). The full check (`pnpm check`: the rules and assets checks too) and the browser
# suite stay local, run before every push by the maintainer's watcher, so Actions minutes stay low on the
# free plan. Enabled on GitHub by the maintainer on 10 Oct 2026.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # check:protected diffs against the base branch, so it needs history.
          fetch-depth: 0

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Protected files
        if: github.event_name == 'pull_request'
        env:
          APPROVED_TEST_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'approved-test-change') && '1' || '0' }}
        run: pnpm check:protected -- origin/${{ github.base_ref }}
