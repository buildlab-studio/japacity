# Dependency updates: npm and the workflows' actions, weekly. The npm minor and patch updates
# come grouped in one pull request; a major one comes alone, since the main tools are pinned on purpose (AGENTS.md,
# "Versions"). Every update goes through the check workflow like any pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
